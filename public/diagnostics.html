<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울 문제 확인</title>
<style>body{margin:0;background:#f6f2e7;color:#293b34;font:16px/1.6 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:24px 20px}h1{font-size:24px;margin:0 0 12px}p{margin:12px 0}button,a{font:inherit}button{background:#294c40;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}a{color:#294c40}pre{padding:16px;background:white;border:1px solid #d6d4c7;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace}#status{min-height:24px}</style>
<main><h1>서울 문제 확인</h1><p>이 브라우저의 최근 로딩·그래픽 복구 기록입니다. 중단 직전 카메라 거리·건물 가림·처리 단계도 보관합니다. 닉네임·대화·보행 좌표는 포함하지 않으며 자동으로 전송하지 않습니다.</p><p id="summary"></p><button id="copy" type="button">진단 정보 복사</button> <a href="/">서울로 돌아가기</a><p id="status" role="status"></p><pre id="report">확인 중</pre></main>
<script>
const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback;}catch{return fallback;}};
const guard=read('cereels-seoul-quality-v1',{}),events=read('cereels-seoul-loading-history',[]);
const currentPlayback=read('cereels-seoul-playback-trace-v1',null),playbackHistory=read('cereels-seoul-playback-history-v1',[]),previousPlayback=Array.isArray(playbackHistory)?playbackHistory.at(-1)||null:null;
const reasons={initial:'첫 입장','interrupted-start':'정상 종료 기록 없이 다시 시작',landmark:'지도 이동','third-person':'3인칭 전환','position-correction':'서버 위치 보정','graphics-lost':'그래픽 연결 중단','graphics-resume':'그래픽 중단 후 복구'};
const report={at:new Date().toISOString(),browser:navigator.userAgent,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},build:'확인 중',quality:{level:guard.level,cap:guard.cap,safety:guard.safety,resources:guard.resources},events:Array.isArray(events)?events.slice(-12).map(e=>({reason:e.reason,label:reasons[e.reason]||e.reason,at:e.at,detail:e.detail})):[],playback:{current:currentPlayback,previous:previousPlayback,otherRuns:Array.isArray(playbackHistory)?playbackHistory.slice(0,-1).map(v=>({id:v.id,started:v.started,updated:v.updated,status:v.status})):[]}};
const last=previousPlayback||currentPlayback,types=last?.events?.map(e=>e.type)||[];
document.getElementById('summary').textContent=types.includes('reload-requested')?'이전 실행에서 게임이 그래픽 복구를 위해 새로고침을 요청했습니다.':types.includes('error')||types.includes('rejection')?'이전 실행에 프로그램 오류 기록이 있습니다.':last?'중단 원인은 상세 기록의 마지막 카메라 상태와 이벤트를 함께 확인해야 합니다.':'상세 추적을 포함한 버전으로 플레이하면 이곳에 기록이 남습니다.';
const render=()=>document.getElementById('report').textContent=JSON.stringify(report,null,2);render();
fetch('/healthz').then(r=>r.json()).then(v=>{report.build=v.build||'unknown';render();}).catch(()=>{report.build='연결 확인 불가';render();});
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(report));document.getElementById('status').textContent='복사했습니다. 문의할 때 붙여 넣어 주세요.';}catch{document.getElementById('status').textContent='아래 진단 정보를 선택해 복사해 주세요.';}};
</script></html>
